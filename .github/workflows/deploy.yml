name: Build and Deploy to Aliyun

on:
  push:
    branches: [ "main" ]

env:
  IMAGE_NAME: homeworkreminder

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: extract-version
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "owner=$OWNER" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: |
            ghcr.io/${{ steps.extract-version.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ steps.extract-version.outputs.tag }}
            ghcr.io/${{ steps.extract-version.outputs.owner }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "server/docker-compose.yml"
          target: "/home/deploy/homework-reminder/server/"
          strip_components: 1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop: true
          script: |
            cd /home/deploy/homework-reminder/server
            printf 'FEISHU_WEBHOOK=%s\nAUTH_ENABLED=%s\nAUTH_USER=%s\nAUTH_PASS=%s\n' \
              '${{ secrets.FEISHU_WEBHOOK }}' \
              '${{ secrets.AUTH_ENABLED }}' \
              '${{ secrets.AUTH_USER }}' \
              '${{ secrets.AUTH_PASS }}' > .env
            docker logout ghcr.io || true
            docker pull ghcr.io/a1oha666/${{ env.IMAGE_NAME }}:latest
            docker compose up -d
            docker image prune -f
